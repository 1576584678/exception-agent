<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exception Insight · 异常分析平台</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='8' fill='%234f46e5'/%3E%3Cpath d='M6.5 18.5h4l2.6-6.5 3.2 9.5 2.6-5.5h4.1' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f4f6fb; --surface:#fff; --surface-2:#f8fafc; --border:#e6e9f0;
    --text:#0f172a; --muted:#64748b; --primary:#4f46e5; --primary-2:#6366f1;
    --primary-soft:#eef2ff; --success:#16a34a; --danger:#dc2626; --warn:#d97706;
    --radius:14px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 6px 20px rgba(15,23,42,.08);
    --shadow-lg:0 20px 60px rgba(15,23,42,.22);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:60px;min-height:60px;padding:0 22px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;white-space:nowrap;user-select:none}
  .logo{width:32px;height:32px;flex:0 0 32px;border-radius:10px;box-shadow:0 2px 6px rgba(79,70,229,.28);display:block}
  .brand-text{display:flex;flex-direction:column;justify-content:center;line-height:1.2}
  .brand-text strong{font-size:15px;font-weight:800;letter-spacing:-.2px;color:var(--text)}
  .brand-text small{font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:1.2px;margin-top:2px}
  .spacer{flex:1}
  .userchip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:6px 12px;border-radius:999px}
  .userchip .av{width:20px;height:20px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .proj-select{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--text);max-width:210px;outline:0;cursor:pointer;font-weight:600}
  .proj-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
  .btn{border:0;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.18s}
  .btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
  .btn-ghost:hover{background:var(--surface-2)}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(79,70,229,.34)}
  .btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
  .workspace{max-width:920px;margin:0 auto;padding:34px 22px 80px}
  .hero h1{font-size:30px;line-height:1.25;margin:0 0 10px;letter-spacing:-.5px}
  .hero h1 .accent{background:linear-gradient(135deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.7;max-width:640px}
  .input-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px}
  textarea#desc{width:100%;border:0;outline:0;resize:vertical;min-height:120px;font-size:14px;line-height:1.7;color:var(--text);background:transparent}
  textarea#desc::placeholder{color:#9aa4b2}
  .input-toolbar{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .upload{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:8px 12px;border-radius:9px;cursor:pointer}
  .upload:hover{color:var(--text)}
  .upload input{display:none}
  .grow{flex:1}
  .msg{font-size:12.5px;margin-left:6px}
  .msg.ok{color:var(--success)} .msg.err{color:var(--danger)}
  #imgPreview{margin-top:12px;max-width:200px;border-radius:10px;border:1px solid var(--border)}
  .report{margin-top:26px}
  .rep-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);overflow:hidden}
  .rep-head{position:relative;padding:22px 24px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
  .rep-del{position:absolute;top:16px;right:16px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;transition:.15s}
  .rep-del:hover{color:var(--danger);border-color:#fecaca;background:#fef2f2}
  .hist-del{border:0;background:transparent;color:#c0c8d4;font-size:15px;width:24px;height:24px;border-radius:6px;cursor:pointer;line-height:1;flex-shrink:0}
  .hist-del:hover{color:var(--danger);background:#fef2f2}
  .rep-concl{font-size:19px;font-weight:700;line-height:1.45;margin-bottom:12px;padding-right:110px}
  .rep-badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
  .badge.type{background:var(--primary-soft);border-color:#dcd8ff;color:var(--primary)}
  .badge.high{background:#dcfce7;border-color:#bbf7d0;color:#15803d}
  .badge.medium{background:#fef3c7;border-color:#fde68a;color:#a16207}
  .badge.low{background:#fee2e2;border-color:#fecaca;color:#b91c1c}
  .badge.partial{background:#fef3c7;border-color:#fde68a;color:#a16207}
  .badge.done{background:#dcfce7;border-color:#bbf7d0;color:#15803d}
  .rep-body{padding:8px 24px 24px}
  .rep-section{padding:16px 0;border-bottom:1px dashed var(--border)}
  .rep-section:last-child{border-bottom:0}
  .rep-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
  /* 可折叠分区 */
  .sec-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .sec-toggle .chev{font-size:10px;color:var(--muted);transition:transform .18s;display:inline-block}
  .sec-toggle.open .chev{transform:rotate(90deg)}
  .sec-body{display:none;margin-top:2px}
  .sec-body.open{display:block}
  .count-pill{font-size:10.5px;font-weight:700;color:var(--primary);background:var(--primary-soft);border:1px solid #dcd8ff;border-radius:999px;padding:1px 8px;text-transform:none;letter-spacing:0}
  .more-btn{display:block;width:100%;margin-top:8px;padding:8px;border:1px dashed var(--border);border-radius:8px;background:var(--surface);color:var(--primary);font-size:12.5px;font-weight:600;cursor:pointer}
  .more-btn:hover{background:var(--primary-soft);border-color:var(--primary-2)}
  .ev-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .ev-list li{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.6}
  .ev-list li.ev{cursor:pointer;transition:.15s}
  .ev-list li.ev:hover{border-color:#c7cdf8}
  .ev-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .lv{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:5px;background:#f1f5f9;color:var(--muted)}
  .lv.ERROR{background:#fee2e2;color:#b91c1c}
  .lv.WARN{background:#fef3c7;color:#a16207}
  .lv.INFO{background:var(--primary-soft);color:var(--primary)}
  .lv.code,.lv.blame,.lv.data{background:#ecfeff;color:#0e7490}
  .ev-time{font-size:11px;color:var(--muted);margin-left:auto}
  .ev-msg{font-size:12.5px;line-height:1.65;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
  .ev.expanded .ev-msg{display:block;-webkit-line-clamp:unset;overflow:visible}
  .ev-meta{display:none;font-size:11px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);word-break:break-all}
  .ev.expanded .ev-meta{display:block}
  .ev-src{font-weight:700;color:var(--primary);margin-right:6px}
  .kv{font-size:13.5px;line-height:1.9}
  .kv .k{color:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:12.5px}
  .muted{color:var(--muted);font-size:12.5px}
  .hl{color:var(--danger);font-weight:600}
  .hl-ok{color:var(--success);font-weight:600}
  .drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.32);opacity:0;pointer-events:none;transition:.24s;z-index:40}
  .drawer-mask.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
  .drawer-head h2{font-size:16px;margin:0}
  .x{background:var(--surface-2);border:1px solid var(--border);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--muted);line-height:1}
  .drawer-body{padding:18px 20px;overflow-y:auto;flex:1}
  .field-group{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;background:var(--surface-2)}
  .field-group-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .field-group-title .idx{width:20px;height:20px;border-radius:6px;background:var(--primary-soft);color:var(--primary);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
  label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
  input.f,select.f{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);outline:0;transition:.15s}
  input.f:focus,select.f:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
  .drawer-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .drawer-foot .btn-primary{flex:1}
  .key-state{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:#f1f5f9;color:var(--muted);border:1px solid var(--border);margin-left:4px}
  .key-state.ok{background:#dcfce7;border-color:#bbf7d0;color:#15803d}
  .tag-global,.tag-proj{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:auto;letter-spacing:0}
  .tag-global{background:#ecfeff;border:1px solid #a5f3fc;color:#0e7490}
  .tag-proj{background:var(--primary-soft);border:1px solid #dcd8ff;color:var(--primary)}
  .danger-link{background:none;border:0;padding:0;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .danger-link:hover{color:var(--danger)}
  .history{margin-top:34px}
  .history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .history-head h2{font-size:16px;margin:0}
  .history-head .muted{font-size:12px}
  .hist-list{display:flex;flex-direction:column;gap:10px}
  .hist-item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;transition:.15s}
  .hist-item:hover{border-color:var(--primary-2);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .hist-ic{width:34px;height:34px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .hist-main{flex:1;min-width:0}
  .hist-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist-sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist-meta{font-size:12px;color:var(--muted);flex-shrink:0;text-align:right}
  .empty{border:1.5px dashed var(--border);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted);font-size:13px;background:transparent}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:60}
  .modal.show{display:flex}
  .modal-card{background:var(--surface);border-radius:16px;padding:24px;width:340px;box-shadow:var(--shadow-lg)}
  .modal-card h2{margin:0 0 16px;font-size:17px}
  .modal-card label.f{font-size:12px}
  @media(max-width:560px){.hero h1{font-size:24px}.workspace{padding:22px 14px 60px}.brand-text small{display:none}.topbar{padding:0 14px;gap:10px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-label="Exception Insight">
      <defs>
        <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6366f1" />
          <stop offset="1" stop-color="#4338ca" />
        </linearGradient>
      </defs>
      <rect width="32" height="32" rx="10" fill="url(#brandGrad)" />
      <path d="M6.5 19.5h4.6l2.7-7 3.4 10.2 2.7-6h5.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="25.6" cy="16.7" r="1.7" fill="#fff" />
    </svg>
    <span class="brand-text"><strong>Exception Insight</strong><small>异常分析平台</small></span>
  </div>
  <div class="spacer"></div>
  <select class="proj-select" id="projectSel" onchange="switchProject(this.value)" title="切换项目"></select>
  <button class="btn btn-ghost" onclick="openNewProject()">+ 项目</button>
  <div class="userchip" id="userchip"><span class="av">?</span><span id="userText">未登录</span></div>
  <button class="btn btn-ghost" id="openConfigBtn" onclick="openConfig()">配置</button>
</header>

<main class="workspace">
  <section class="hero">
    <h1>输入报错，<span class="accent">快速定位</span>问题</h1>
    <p>粘贴报错日志 / 堆栈，或上传报错截图。平台结合日志、代码与数据，输出带可回溯证据的归因报告（代码位置、提交人、数据定位）。</p>
    <div class="input-card">
      <textarea id="desc" placeholder="例如：订单详情页白屏，报 NullPointerException at OrderDetailService.java:128"></textarea>
      <div class="input-toolbar">
        <label class="upload">上传截图<input type="file" id="img" accept="image/*" onchange="previewImg(event)" /></label>
        <span class="grow"></span>
        <span class="msg" id="anaMsg"></span>
        <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()">分析</button>
      </div>
      <img id="imgPreview" class="hidden" style="display:none" alt="截图预览" />
    </div>
  </section>

  <section class="report" id="reportSection" style="display:none">
    <div class="rep-card" id="reportCard"></div>
  </section>

  <section class="history">
    <div class="history-head">
      <h2>最近分析</h2>
      <span class="muted" id="histCount"></span>
    </div>
    <div class="hist-list" id="histList"><div class="empty">暂无分析记录，输入报错信息开始第一次分析</div></div>
  </section>
</main>

<div class="drawer-mask" id="drawerMask" onclick="closeConfig()"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>项目配置</h2>
    <button class="x" onclick="closeConfig()">×</button>
  </div>
  <div class="drawer-body">
    <div class="field-group">
      <div class="field-group-title"><span class="idx">1</span> 大模型 <span class="tag-global">全局 · 所有项目共用</span></div>
      <label class="f">模式</label>
      <select class="f" id="modelPolicy">
        <option value="local">本地 stub（无需模型，先看效果）</option>
        <option value="external">外部大模型（OpenAI 兼容）</option>
      </select>
      <label class="f">模型地址</label>
      <input class="f" id="llmBase" placeholder="http://x.x.x.x:port/v1" />
      <label class="f">模型名</label>
      <input class="f" id="llmModel" placeholder="如 qwen2.5-72b" />
      <label class="f">推理强度（reasoning 模型）</label>
      <select class="f" id="llmEffort">
        <option value="">网关默认</option>
        <option value="none">none · 最快</option>
        <option value="low">low</option>
        <option value="high">high · 推荐</option>
        <option value="max">max · 最慢最准</option>
      </select>
      <label class="f">API Key <span class="key-state" id="llmKeyState">未配置</span></label>
      <input class="f" id="llmKey" type="password" autocomplete="new-password" placeholder="sk-…（留空表示不修改）" />
    </div>
    <div class="field-group">
      <div class="field-group-title"><span class="idx">2</span> 日志源 <span class="tag-proj" id="curProjTag">当前项目</span></div>
      <label class="f">类型</label>
      <select class="f" id="logKind">
        <option value="platform">日志平台链接</option>
        <option value="objectstore">目录 / 对象存储</option>
      </select>
      <label class="f">地址 / 路径</label>
      <input class="f" id="logEndpoint" placeholder="日志平台地址 或 目录路径" />
    </div>
    <div class="field-group">
      <div class="field-group-title"><span class="idx">3</span> 代码仓库</div>
      <label class="f">类型</label>
      <select class="f" id="repoType">
        <option value="git">Git 地址</option>
        <option value="local">本地目录</option>
      </select>
      <label class="f">地址 / 目录</label>
      <input class="f" id="repoUrl" placeholder="Git 地址 或 本地目录路径" />
      <label class="f">分支</label>
      <input class="f" id="repoBranch" placeholder="默认 main" />
      <label class="f">访问 Token <span class="key-state" id="gitTokenState">未配置</span></label>
      <input class="f" id="gitToken" type="password" autocomplete="new-password" placeholder="GitLab read_api 只读 token（留空表示不修改）" />
    </div>
    <p class="muted" style="margin:4px 2px 0">密钥只写入服务端 <span class="mono">.env</span>，不落数据库、不回传明文，保存后立即生效。</p>
    <div style="margin-top:16px;padding-top:12px;border-top:1px dashed var(--border)">
      <button class="danger-link" onclick="deleteProject()">删除当前项目及其全部分析记录</button>
    </div>
  </div>
  <div class="drawer-foot">
    <span class="msg" id="cfgMsg"></span>
    <button class="btn btn-primary" id="saveBtn" onclick="saveConfig()">保存配置</button>
  </div>
</aside>

<div class="modal" id="newProjectModal">
  <div class="modal-card" style="width:400px">
    <h2>新建项目</h2>
    <label class="f">项目名称</label>
    <input class="f" id="npName" placeholder="如 订单服务" />
    <label class="f">环境</label>
    <select class="f" id="npEnv"><option value="prod">生产 prod</option><option value="staging">预发 staging</option></select>
    <label class="f">日志源地址（必填）</label>
    <input class="f" id="npLog" placeholder="http://192.168.x.x:9428/select/logsql/query" />
    <label class="f">代码仓库地址（可选）</label>
    <input class="f" id="npRepo" placeholder="Git 地址 或 本地目录" />
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeNewProject()">取消</button>
      <button class="btn btn-primary" style="flex:1" id="npBtn" onclick="createProject()">创建</button>
    </div>
    <div class="msg err" id="npMsg" style="margin-top:10px"></div>
  </div>
</div>

<div class="modal" id="loginModal">
  <div class="modal-card">
    <h2>登录 Exception Insight</h2>
    <label class="f">工号</label>
    <input class="f" id="emp" value="1001" />
    <label class="f">密码</label>
    <input class="f" id="pwd" type="password" value="dev123" />
    <div style="margin-top:16px"><button class="btn btn-primary" style="width:100%" onclick="login()">登录</button></div>
    <div class="msg err" id="loginMsg" style="margin-top:10px"></div>
  </div>
</div>

<script>
  let PROJECT = localStorage.getItem('ei.project') || 'demo-project-1';
  let token = null;
  let imgData = null;

  function $(id) { return document.getElementById(id); }
  function val(id) { return ($(id).value || '').trim(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function setMsg(id, text, ok) { const el = $(id); el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }
  function setUser(text) { $('userText').textContent = text; $('userchip').querySelector('.av').textContent = (text || '?').slice(0, 1); }

  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {});
    if (token) opts.headers.authorization = 'Bearer ' + token;
    if (opts.body && !opts.headers['content-type']) opts.headers['content-type'] = 'application/json';
    const res = await fetch(path, opts);
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch (e) { data = text; }
    if (!res.ok) throw new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
    return data;
  }

  async function login() {
    try {
      const r = await api('/auth/login', { method: 'POST', body: JSON.stringify({ employeeId: val('emp'), password: val('pwd') }) });
      token = r.token;
      setUser(r.user.name);
      $('loginModal').classList.remove('show');
      $('openConfigBtn').disabled = false;
    } catch (e) {
      setMsg('loginMsg', e.message, false);
      $('loginModal').classList.add('show');
    }
  }

  function openConfig() {
    if (!token) { $('loginModal').classList.add('show'); return; }
    loadConfig();
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    $('drawerMask').classList.add('open');
  }
  function closeConfig() {
    $('drawer').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
    $('drawerMask').classList.remove('open');
  }

  // ===== 项目管理：多项目切换 / 新建 =====
  async function loadProjects() {
    try {
      const list = await api('/projects');
      const sel = $('projectSel');
      if (!Array.isArray(list) || !list.length) {
        sel.innerHTML = '<option value="">（无项目）</option>';
        return;
      }
      sel.innerHTML = list.map(function (p) {
        return '<option value="' + esc(p.id) + '">' + esc(p.name) + (p.env === 'prod' ? ' · prod' : '') + '</option>';
      }).join('');
      if (!list.some(function (p) { return p.id === PROJECT; })) PROJECT = list[0].id;
      sel.value = PROJECT;
      localStorage.setItem('ei.project', PROJECT);
      const cur = list.filter(function (p) { return p.id === PROJECT; })[0];
      if (cur && $('curProjTag')) $('curProjTag').textContent = cur.name;
    } catch (e) { /* 未登录忽略 */ }
  }

  function switchProject(id) {    if (!id || id === PROJECT) return;
    PROJECT = id;
    localStorage.setItem('ei.project', id);
    currentRunId = null;
    $('reportSection').style.display = 'none';
    $('reportCard').innerHTML = '';
    loadProjects();
    loadConfig();
    loadHistory();
  }

  function openNewProject() {
    if (!token) { $('loginModal').classList.add('show'); return; }
    $('npName').value = ''; $('npLog').value = ''; $('npRepo').value = '';
    $('npMsg').textContent = '';
    $('newProjectModal').classList.add('show');
  }
  function closeNewProject() { $('newProjectModal').classList.remove('show'); }

  async function createProject() {
    const name = val('npName');
    const log = val('npLog');
    if (!name) { setMsg('npMsg', '请填写项目名称', false); return; }
    if (!log) { setMsg('npMsg', '请填写日志源地址', false); return; }
    const btn = $('npBtn'); btn.disabled = true; setMsg('npMsg', '', true);
    try {
      const repo = val('npRepo');
      const isGit = /^https?:\/\//i.test(repo);
      const p = await api('/projects', {
        method: 'POST',
        body: JSON.stringify({
          name: name,
          env: val('npEnv'),
          logSources: [{ kind: 'platform', endpoint: log, timeField: '_time', supportsTraceId: true, maxReturn: 2000 }],
          codeSources: repo ? [isGit ? { type: 'git', url: repo, branch: 'main' } : { type: 'local', mountPath: repo }] : []
        })
      });
      closeNewProject();
      PROJECT = p.id;
      localStorage.setItem('ei.project', p.id);
      await loadProjects();
      loadConfig();
      loadHistory();
    } catch (e) {
      setMsg('npMsg', e.message, false);
    } finally { btn.disabled = false; }
  }

  async function deleteProject() {
    const opt = $('projectSel').selectedOptions[0];
    const name = opt ? opt.textContent : PROJECT;
    if (!confirm('删除项目「' + name + '」及其全部分析记录？此操作不可恢复。')) return;
    if (!confirm('再次确认：真的删除「' + name + '」？')) return;
    try {
      await api('/projects/' + PROJECT, { method: 'DELETE' });
      closeConfig();
      currentRunId = null;
      $('reportSection').style.display = 'none';
      $('reportCard').innerHTML = '';
      PROJECT = '';
      await loadProjects();
      await loadConfig();
      loadHistory();
    } catch (e) { setMsg('cfgMsg', e.message, false); }
  }

  async function loadConfig() {
    // 大模型：全局设置（所有项目共用）
    try {
      const s = await api('/settings');
      const llm = (s && s.llm) || {};
      $('modelPolicy').value = llm.modelPolicy || 'local';
      $('llmBase').value = llm.baseUrl || '';
      $('llmModel').value = llm.model || '';
      $('llmEffort').value = llm.reasoningEffort || '';
    } catch (e) { /* 忽略 */ }
    // 日志源 / 代码仓库：当前项目
    try {
      const p = await api('/projects/' + PROJECT);
      const ls = (p.logSources && p.logSources[0]) || {};
      $('logKind').value = ls.kind || 'platform';
      $('logEndpoint').value = ls.endpoint || ls.path || '';
      const cs = (p.codeSources && p.codeSources[0]) || {};
      $('repoType').value = cs.type || 'git';
      $('repoUrl').value = cs.url || cs.mountPath || '';
      $('repoBranch').value = cs.branch || '';
      if ($('curProjTag')) $('curProjTag').textContent = p.name;
    } catch (e) { /* 保留默认 */ }
    loadCredentialState();
  }

  function keyState(id, st) {
    const el = $(id);
    if (st && st.configured) { el.textContent = '已配置 ' + st.masked; el.className = 'key-state ok'; }
    else { el.textContent = '未配置'; el.className = 'key-state'; }
  }

  async function loadCredentialState() {
    try {
      const c = await api('/credentials');
      keyState('llmKeyState', c.llm);
      keyState('gitTokenState', c.gitlab);
    } catch (e) { /* 无权限时静默 */ }
  }

  async function saveConfig() {
    const btn = $('saveBtn'); btn.disabled = true; setMsg('cfgMsg', '', true);
    try {
      // 1) 全局大模型（所有项目共用）
      await api('/settings/llm', {
        method: 'PUT',
        body: JSON.stringify({
          modelPolicy: val('modelPolicy'),
          baseUrl: val('llmBase') || undefined,
          model: val('llmModel') || undefined,
          reasoningEffort: val('llmEffort') || undefined
        })
      });

      // 2) 当前项目的日志源 / 代码仓库
      const body = {
        logSources: [{ kind: val('logKind'), endpoint: val('logEndpoint') || undefined, supportsTraceId: true, maxReturn: 2000 }],
        codeSources: [{
          type: val('repoType'),
          url: val('repoType') === 'git' ? (val('repoUrl') || undefined) : undefined,
          mountPath: val('repoType') === 'local' ? (val('repoUrl') || undefined) : undefined,
          branch: val('repoBranch') || undefined
        }]
      };
      await api('/projects/' + PROJECT, { method: 'PUT', body: JSON.stringify(body) });

      // 3) 密钥：仅在填写时提交，成功后清空输入框
      const key = val('llmKey');
      if (key) {
        const st = await api('/credentials/llm', { method: 'PUT', body: JSON.stringify({ value: key }) });
        keyState('llmKeyState', st); $('llmKey').value = '';
      }
      const tk = val('gitToken');
      if (tk) {
        const st = await api('/credentials/gitlab', { method: 'PUT', body: JSON.stringify({ value: tk }) });
        keyState('gitTokenState', st); $('gitToken').value = '';
      }
      setMsg('cfgMsg', '已保存（模型配置对所有项目生效）', true);
    } catch (e) {
      setMsg('cfgMsg', e.message, false);
    } finally { btn.disabled = false; }
  }

  function previewImg(ev) {
    const f = ev.target.files && ev.target.files[0];
    const img = $('imgPreview');
    if (!f) { imgData = null; img.style.display = 'none'; return; }
    const reader = new FileReader();
    reader.onload = function () { imgData = reader.result; img.src = imgData; img.style.display = 'block'; };
    reader.readAsDataURL(f);
  }

  async function analyze() {
    if (!token) { $('loginModal').classList.add('show'); return; }
    const btn = $('analyzeBtn'); btn.disabled = true; setMsg('anaMsg', '分析中…', true);
    try {
      const desc = val('desc');
      if (!desc && !imgData) { setMsg('anaMsg', '请输入报错信息或上传截图', false); btn.disabled = false; return; }
      const run = await api('/projects/' + PROJECT + '/analyze', {
        method: 'POST',
        body: JSON.stringify({ inputType: imgData ? 'image' : 'text', inputRef: imgData || desc, supplemental: {} })
      });
      setMsg('anaMsg', '完成', true);
      renderReport(run);
      loadHistory();
    } catch (e) {
      setMsg('anaMsg', e.message, false);
    } finally { btn.disabled = false; }
  }

  async function loadHistory() {
    try {
      const runs = await api('/projects/' + PROJECT + '/runs');
      const list = (Array.isArray(runs) ? runs : []).slice().reverse().slice(0, 8);
      $('histCount').textContent = list.length ? ('共 ' + list.length + ' 条（最近优先）') : '';
      if (!list.length) {
        $('histList').innerHTML = '<div class="empty">暂无分析记录，输入报错信息开始第一次分析</div>';
        return;
      }
      $('histList').innerHTML = list.map(function (r) {
        const concl = (r.report && r.report.conclusion) || '（无结论）';
        const input = r.inputType === 'image' ? '📷 截图输入' : String(r.inputRef || '').slice(0, 60);
        const st = r.status === 'completed' ? 'done' : r.status === 'partial' ? 'partial' : 'low';
        return '<div class="hist-item" onclick="viewRun(\'' + esc(r.id) + '\')">'
          + '<div class="hist-ic">📄</div>'
          + '<div class="hist-main"><div class="hist-title">' + esc(concl) + '</div>'
          + '<div class="hist-sub">' + esc(input) + '</div></div>'
          + '<div class="hist-meta"><span class="badge ' + st + '">' + esc(r.status) + '</span>'
          + '<div style="margin-top:4px">' + esc(String(r.createdAt || '').slice(0, 19).replace('T', ' ')) + '</div></div>'
          + '<button class="hist-del" title="删除此记录" onclick="deleteRun(\'' + esc(r.id) + '\', event)">×</button>'
          + '</div>';
      }).join('');
    } catch (e) { /* 未登录等情况忽略 */ }
  }

  async function viewRun(runId) {
    try {
      const run = await api('/runs/' + runId);
      renderReport(run);
    } catch (e) { setMsg('anaMsg', e.message, false); }
  }

  let currentRunId = null;

  async function deleteRun(runId, ev) {
    if (ev) ev.stopPropagation();
    if (!confirm('确定删除这条分析记录吗？相关证据将一并清除，不可恢复。')) return;
    try {
      await api('/runs/' + runId, { method: 'DELETE' });
      if (currentRunId === runId) {
        currentRunId = null;
        $('reportSection').style.display = 'none';
        $('reportCard').innerHTML = '';
      }
      loadHistory();
    } catch (e) { setMsg('anaMsg', e.message, false); }
  }

  // ===== 报告渲染：分区可折叠；证据链默认收起、分页加载 =====
  let EVDATA = [];
  const EV_PAGE = 20;

  function toggleSec(el) {
    el.classList.toggle('open');
    const body = el.nextElementSibling;
    if (body && body.classList.contains('sec-body')) body.classList.toggle('open');
  }

  // 展开态分区
  function secOpen(title, extra, inner) {
    return '<div class="rep-section"><div class="rep-label sec-toggle open" onclick="toggleSec(this)">'
      + '<span class="chev">▸</span>' + title + (extra || '')
      + '</div><div class="sec-body open">' + inner + '</div></div>';
  }

  function evItem(e) {
    const n = e.normalized || {};
    const lv = String(n.level || '').toUpperCase();
    const label = lv || (e.sourceType === 'log' ? 'LOG' : e.sourceType === 'code' ? 'CODE' : e.sourceType === 'blame' ? 'BLAME' : e.sourceType === 'data' ? 'DATA' : 'EV');
    const cls = lv === 'ERROR' || lv === 'WARN' || lv === 'INFO' ? lv : (e.sourceType === 'code' || e.sourceType === 'blame' || e.sourceType === 'data' ? e.sourceType : '');
    const t = n.time ? String(n.time).replace('T', ' ').slice(5, 19) : '';
    return '<li class="ev" onclick="this.classList.toggle(\'expanded\')">'
      + '<div class="ev-head"><span class="lv ' + esc(cls) + '">' + esc(label) + '</span>'
      + (n.service ? '<span class="mono">' + esc(n.service) + '</span>' : '')
      + (t ? '<span class="ev-time">' + esc(t) + '</span>' : '')
      + '</div>'
      + '<div class="ev-msg">' + esc(n.message || n.stack || '(无消息)') + '</div>'
      + '<div class="ev-meta">' + esc(e.rawPointer || '')
      + (n.traceId ? ' · trace ' + esc(n.traceId) : '')
      + (e.dedupCount ? ' · 重复 ' + esc(e.dedupCount) + ' 次' : '')
      + '</div></li>';
  }

  function renderEvidence(page) {
    const ul = $('evList');
    if (!ul) return;
    if (!EVDATA.length) { ul.innerHTML = '<li>（无）</li>'; $('evMore').innerHTML = ''; return; }
    const shown = Math.min(EVDATA.length, page * EV_PAGE);
    ul.innerHTML = EVDATA.slice(0, shown).map(evItem).join('');
    $('evMore').innerHTML = shown < EVDATA.length
      ? '<button class="more-btn" onclick="renderEvidence(' + (page + 1) + ')">展开更多 · 还剩 ' + (EVDATA.length - shown) + ' 条</button>'
      : '<div class="muted" style="text-align:center;padding:8px 0">已显示全部 ' + EVDATA.length + ' 条</div>';
  }

  function renderReport(run) {
    currentRunId = run.id;
    const r = run.report || {};
    const f = (r.findings || [])[0] || {};
    const cl = f.codeLocation;
    const dp = f.dataProbe;
    const conf = r.confidence || '-';
    const confClass = conf === 'high' ? 'high' : conf === 'medium' ? 'medium' : 'low';
    const statusClass = run.status === 'completed' ? 'done' : 'partial';
    EVDATA = r.evidenceChain || [];

    let html = '';
    html += '<div class="rep-head">';
    html += '<button class="rep-del" onclick="deleteRun(\'' + esc(run.id) + '\')">🗑 删除</button>';
    html += '<div class="rep-concl">' + esc(r.conclusion || '（无结论）') + '</div>';
    html += '<div class="rep-badges">';
    html += '<span class="badge type">' + esc(r.conclusionType || 'unknown') + '</span>';
    html += '<span class="badge ' + confClass + '">置信度 ' + esc(conf) + '</span>';
    html += '<span class="badge ' + statusClass + '">' + esc(run.status) + '</span>';
    html += '</div></div>';

    html += '<div class="rep-body">';

    // 证据链：默认收起，点标题展开；展开后分页渲染
    html += '<div class="rep-section"><div class="rep-label sec-toggle" onclick="toggleSec(this)">'
      + '<span class="chev">▸</span>证据链'
      + '<span class="count-pill">' + (EVDATA.length || '无') + (EVDATA.length ? ' 条' : '') + '</span>'
      + '</div><div class="sec-body">'
      + '<ul class="ev-list" id="evList"></ul><div id="evMore"></div>'
      + '</div></div>';

    if (cl) {
      let inner = '<div class="kv">';
      inner += '<div><span class="mono">' + esc(cl.file) + ':' + esc(cl.line) + '</span></div>';
      inner += '<div><span class="k">提交</span> <span class="mono">' + esc(cl.blame.shortSha) + '</span> · ' + esc(cl.blame.authorName) + (cl.blame.authorEmployeeId ? ('（工号 ' + esc(cl.blame.authorEmployeeId) + '）') : '') + ' · ' + esc(cl.blame.committedAt) + '</div>';
      inner += '<div><span class="k">说明</span> ' + esc(cl.blame.message) + '</div>';
      inner += '<div class="muted" style="margin-top:6px">' + esc(cl.blame.note) + '</div>';
      inner += '</div>';
      html += secOpen('代码位置', '', inner);
    }

    if (dp) {
      const hl = (dp.highlighted || []).map(function (h) { return '<div>' + esc(h.field) + '：<span class="hl-ok">期望 ' + esc(h.expected) + '</span> / <span class="hl">实际 ' + esc(h.actual) + '</span></div>'; }).join('');
      let inner = '<div class="kv">';
      inner += '<div>表 <span class="mono">' + esc(dp.table) + '</span> · 主键 ' + esc(dp.pkField) + '=' + esc(dp.pkValue) + ' · 状态 ' + esc(dp.status) + '</div>';
      if (dp.reason) inner += '<div class="muted">' + esc(dp.reason) + '</div>';
      inner += hl + '</div>';
      html += secOpen('数据定位', '', inner);
    }

    if (r.impact) html += secOpen('影响面', '', '<div class="kv">' + esc(r.impact) + '</div>');
    if (r.suggestions && r.suggestions.length) {
      html += secOpen('建议', '<span class="count-pill">' + r.suggestions.length + '</span>',
        '<ul class="ev-list">' + r.suggestions.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>');
    }
    if (r.unverified && r.unverified.length) {
      html += secOpen('未验证项', '<span class="count-pill">' + r.unverified.length + '</span>',
        '<ul class="ev-list">' + r.unverified.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>');
    }
    html += '</div>';

    $('reportCard').innerHTML = html;
    renderEvidence(1);
    $('reportSection').style.display = 'block';
    $('reportSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeConfig(); });
  window.addEventListener('load', function () {
    $('openConfigBtn').disabled = true;
    login().then(async function () {
      await loadProjects();
      loadHistory();
      if (location.search.indexOf('config=1') >= 0) openConfig();
      // 深链：?run=<id> 直接打开某次报告
      const runId = new URLSearchParams(location.search).get('run');
      if (runId) viewRun(runId);
    });
  });
</script>
</body>
</html>
